<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">

<title>IELTS 写作词汇训练器 — Simon 9分语料库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5; color: #333; min-height: 100vh;
}

/* ── Header ── */
.header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; padding: 20px 24px; text-align: center;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
.header .subtitle { font-size: 12px; opacity: 0.7; margin-top: 4px; }

/* ── Stats Bar ── */
.stats-bar {
    display: flex; justify-content: center; gap: 24px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #e8e8e8;
    font-size: 13px; color: #666;
}
.stats-bar span { text-align: center; }
.stats-bar strong { color: #1a1a2e; display: block; font-size: 18px; }

/* ── Category Tabs ── */
.tabs {
    display: flex; gap: 0; padding: 12px 16px; background: #fff;
    border-bottom: 1px solid #e8e8e8; overflow-x: auto;
    position: sticky; top: 108px; z-index: 99;
}
.tab {
    padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
    border: 1px solid #ddd; background: #fff; color: #666;
    white-space: nowrap; transition: all 0.2s; margin-right: 8px;
    user-select: none;
}
.tab:hover { background: #f0f4ff; border-color: #2980b9; }
.tab.active { background: #2980b9; color: #fff; border-color: #2980b9; }

/* ── Mode Switcher ── */
.mode-bar {
    display: flex; justify-content: center; gap: 12px; padding: 16px;
}
.mode-btn {
    padding: 8px 24px; border-radius: 20px; border: 2px solid #ddd;
    background: #fff; font-size: 14px; cursor: pointer; transition: all 0.2s;
    user-select: none;
}
.mode-btn:hover { border-color: #2980b9; }
.mode-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

/* ── Card Container ── */
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 32px; }

.card {
    background: #fff; border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-top: 8px;
    min-height: 360px; display: flex; flex-direction: column;
    justify-content: center; transition: transform 0.3s, opacity 0.3s;
    cursor: pointer; position: relative; overflow: hidden;
    user-select: none;
}
.card.flipped { transform: rotateY(0); }
.card .card-inner {
    text-align: center;
}
.card .phrase {
    font-size: 26px; font-weight: 700; color: #1a1a2e;
    line-height: 1.5; margin-bottom: 8px;
}
.card .chinese {
    font-size: 16px; color: #888; margin-bottom: 20px;
}
.card .divider {
    width: 40px; height: 3px; background: #2980b9; margin: 0 auto 20px;
    border-radius: 2px;
}
.card .example-label {
    font-size: 11px; color: #999; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 8px;
}
.card .example {
    font-size: 15px; color: #555; line-height: 1.8;
    font-style: italic; background: #f8f9fc; padding: 16px 20px;
    border-radius: 10px; border-left: 3px solid #2980b9;
    text-align: left;
}
.card .source {
    font-size: 11px; color: #aaa; margin-top: 16px;
}
.card .category-badge {
    position: absolute; top: 16px; right: 16px;
    font-size: 10px; padding: 3px 10px; border-radius: 10px;
    background: #e8f4fd; color: #2980b9;
}

/* ── Quiz mode ── */
.card .blank {
    display: inline-block; min-width: 120px; border-bottom: 2px dashed #e74c3c;
    padding: 0 8px; margin: 0 4px; color: #e74c3c; font-weight: 600;
}
.card .quiz-input {
    width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 10px;
    font-size: 16px; text-align: center; margin: 12px 0; outline: none;
    transition: border-color 0.2s;
}
.card .quiz-input:focus { border-color: #2980b9; }
.card .quiz-hint { font-size: 14px; color: #888; margin-bottom: 12px; }
.card .quiz-result { font-size: 14px; margin-top: 8px; min-height: 20px; }

/* ── Action Buttons ── */
.actions {
    display: flex; gap: 12px; justify-content: center; margin-top: 20px;
}
.btn {
    padding: 12px 32px; border-radius: 24px; border: none; font-size: 15px;
    cursor: pointer; transition: all 0.2s; font-weight: 500; user-select: none;
}
.btn-know { background: #27ae60; color: #fff; }
.btn-know:hover { background: #219a52; transform: translateY(-1px); }
.btn-unknown { background: #e74c3c; color: #fff; }
.btn-unknown:hover { background: #c0392b; transform: translateY(-1px); }
.btn-next { background: #2980b9; color: #fff; }
.btn-next:hover { background: #2471a3; transform: translateY(-1px); }
.btn-show { background: #8e44ad; color: #fff; }
.btn-show:hover { background: #7d3c98; }
.btn-skip { background: #95a5a6; color: #fff; }
.btn-skip:hover { background: #7f8c8d; }

/* ── Progress ── */
.progress-text {
    text-align: center; font-size: 13px; color: #999; margin-top: 16px;
}
.progress-bar {
    height: 4px; background: #e8e8e8; border-radius: 2px; margin-top: 8px;
    overflow: hidden;
}
.progress-bar .fill {
    height: 100%; background: #2980b9; border-radius: 2px; transition: width 0.3s;
}

/* ── Keyboard hints ── */
.kbd-hints {
    text-align: center; font-size: 12px; color: #bbb; margin-top: 20px;
}
.kbd {
    display: inline-block; background: #eee; padding: 1px 7px; border-radius: 4px;
    border: 1px solid #ddd; font-family: monospace; font-size: 11px;
}

/* ── Responsive ── */
@media (max-width: 480px) {
    .card { padding: 24px 18px; min-height: 300px; }
    .card .phrase { font-size: 22px; }
    .btn { padding: 10px 20px; font-size: 14px; }
    .stats-bar { gap: 12px; font-size: 11px; }
    .stats-bar strong { font-size: 15px; }
}
</style>
</head>

 "chinese": "解决问题（能力）", "example": "Homework encourages independent learning and problem solving.", "category": "topic", "source": "Homework for School Children"}, {"phrase": "consolidate understanding", "chinese": "巩固理解", "example": "Students consolidate their understanding of the concepts taught by their teacher.", "category": "topic", "source": "Homework for School Children"}, {"phrase": "study habit", "chinese": "学习习惯", "example": "It is important for children to develop an independent study habit.", "category": "topic", "source": "Homework for School Children"}, {"phrase": "league tables", "chinese": "排名表", "example": "Countries such as Finland regularly top international educational league tables.", "category": "topic", "source": "Homework for School Children"}, {"phrase": "face-to-face", "chinese": "面对面的", "example": "Students may not have the opportunity to engage face-to-face with their teachers.", "category": "topic", "source": "Online University Courses"}, {"phrase": "peer support", "chinese": "同伴支持", "example": "This could have a negative impact on peer support, discussion and exchange of ideas.", "category": "topic", "source": "Online University Courses"}, {"phrase": "open access", "chinese": "开放获取", "example": "Online learning offers open access to anybody who is willing to study.", "category": "topic", "source": "Online University Courses"}, {"phrase": "natural habitats", "chinese": "自然栖息地", "example": "It is usually the protection of natural habitats that ensures the survival of wild animals.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "carbon dioxide", "chinese": "二氧化碳", "example": "Rainforests produce oxygen, absorb carbon dioxide and stabilise the Earth's climate.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "natural balance", "chinese": "自然平衡", "example": "By protecting wild animals and their habitats, we maintain the natural balance of all life on Earth.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "conservation", "chinese": "保护；保育", "example": "The costs of managing the resulting changes would far outweigh the costs of conservation.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "extinction", "chinese": "灭绝", "example": "There is nothing special about this century that means we have the right to allow the extinction of any species.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "survival", "chinese": "生存", "example": "These habitats are also crucial for human survival.", "category": "topic", "source": "Wild Animals Protection"}, {"phrase": "cultural identity", "chinese": "文化认同", "example": "A language has a vital connection with the cultural identity of the people who speak it.", "category": "topic", "source": "Minority Languages"}, {"phrase": "traditional ways of life", "chinese": "传统生活方式", "example": "Advances in technology have contributed to the disappearance of traditional ways of life.", "category": "topic", "source": "Traditions and Technology"}, {"phrase": "shared customs", "chinese": "共同的习俗", "example": "These communities had a strong sense of identity, due to their shared customs and beliefs.", "category": "topic", "source": "Traditions and Technology"}, {"phrase": "sense of identity", "chinese": "身份认同感", "example": "These communities had a strong sense of identity.", "category": "topic", "source": "Traditions and Technology"}, {"phrase": "cultural diversity", "chinese": "文化多样性", "example": "We will lose the rich cultural diversity that makes societies more interesting.", "category": "topic", "source": "Minority Languages"}, {"phrase": "cultural heritage", "chinese": "文化遗产", "example": "In the long term this would have an extremely negative impact on our cultural heritage.", "category": "topic", "source": "Minority Languages"}, {"phrase": "standard of living", "chinese": "生活水平", "example": "The general population will experience an improved standard of living.", "category": "topic", "source": "High Salaries Cap"}, {"phrase": "tax revenues", "chinese": "税收收入", "example": "This should result in a thriving economy and increased tax revenues.", "category": "topic", "source": "High Salaries Cap"}, {"phrase": "public services", "chinese": "公共服务", "example": "This money might be better spent on other public services.", "category": "topic", "source": "Minority Languages"}, {"phrase": "executive salaries", "chinese": "高管薪酬", "example": "With lower executive salaries, it might become feasible to introduce higher minimum wages.", "category": "topic", "source": "High Salaries Cap"}, {"phrase": "road safety", "chinese": "道路安全", "example": "Other measures would be more effective in improving road safety.", "category": "topic", "source": "Strict Punishments for Driving Offences"}, {"phrase": "driving test", "chinese": "驾照考试", "example": "This could be done as part of an extended or more difficult driving test.", "category": "topic", "source": "Strict Punishments for Driving Offences"}, {"phrase": "public transport", "chinese": "公共交通", "example": "Governments could reduce road accidents by investing in better public transport.", "category": "topic", "source": "Strict Punishments for Driving Offences"}, {"phrase": "prison sentences", "chinese": "监禁刑罚", "example": "There are various types of driving penalty, such as small fines, licence suspension, and even prison sentences.", "category": "topic", "source": "Strict Punishments for Driving Offences"}, {"phrase": "deterrent", "chinese": "威慑（物）", "example": "Penalties for dangerous drivers can act as a deterrent.", "category": "topic", "source": "Strict Punishments for Driving Offences"}];
const CAT_NAMES = {"academic": "学术搭配", "cohesive": "衔接过渡", "structure": "高分句型", "topic": "话题词汇"};
const STORAGE_KEY = 'ielts_vocab_trainer_state';

// ── State ──
let state = {
    mode: 'learn',       // learn | quiz | review
    category: 'all',
    currentIndex: 0,
    isFlipped: false,
    streak: 0,
    learned: {},       // { phrase_id: times_correct }
    filteredItems: [],
    quizShown: false,
};

function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
            state.learned = saved.learned || {};
            state.streak = saved.streak || 0;
        }
    } catch(e) {}
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            learned: state.learned,
            streak: state.streak,
        }));
    } catch(e) {}
}

// ── Filter items ──
function getFilteredItems() {
    if (state.category === 'all') return [...DATA];
    return DATA.filter(item => item.category === state.category);
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ── Get items for current mode ──
function getReviewItems() {
    // Items not yet learned (learned < 3 times)
    const items = getFilteredItems();
    return items.filter((_, i) => {
        const id = getItemId(items[i]);
        return !state.learned[id] || state.learned[id] < 3;
    });
}

function getItemId(item) {
    return item.phrase;
}

// ── Render ──
function renderCard() {
    const card = document.getElementById('card');
    const content = document.getElementById('cardContent');
    const items = state.filteredItems;

    if (items.length === 0) {
        content.innerHTML = `
            <div style="text-align:center;padding:40px 20px;">
            <div style="font-size:48px;margin-bottom:16px;">&#127881;</div>
            <div style="font-size:20px;color:#27ae60;font-weight:600;margin-bottom:8px;">这一组你已经全部掌握了!</div>
            <div style="font-size:14px;color:#888;">换一个分类或模式继续学习吧</div>
            </div>`;
        document.getElementById('actions').innerHTML = `
            <button class="btn btn-next" onclick="resetCategory()">重新学习本组</button>`;
        updateStats();
        return;
    }

    if (state.currentIndex >= items.length) {
        state.currentIndex = 0;
        state.filteredItems = shuffle(items);
    }

    const item = items[state.currentIndex];
    const catName = CAT_NAMES[item.category] || item.category;

    if (state.mode === 'learn') {
        if (!state.isFlipped) {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="phrase">${item.phrase}</div>
                    <div class="chinese">${item.chinese}</div>
                    <div style="color:#bbb;font-size:12px;margin-top:30px;">点击卡片或按空格键查看例句</div>
                </div>`;
        } else {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="phrase">${item.phrase}</div>
                    <div class="chinese">${item.chinese}</div>
                    <div class="divider"></div>
                    <div class="example-label">原文例句</div>
                    <div class="example">${item.example}</div>
                    <div class="source">— ${item.source}</div>
                </div>`;
        }
    } else if (state.mode === 'quiz') {
        // Blank out the keyword from the example
        const phrase = item.phrase;
        const example = item.example;
        const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(escaped.replace(/\s+/g, '\\s+'), 'i');
        const blankedExample = example.replace(regex, '<span class="blank">?</span>');

        if (!state.quizShown) {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="quiz-hint">提示: ${item.chinese}</div>
                    <div style="font-size:15px;color:#555;line-height:1.8;text-align:left;background:#f8f9fc;padding:16px 20px;border-radius:10px;border-left:3px solid #e74c3c;">
                        ${blankedExample}
                    </div>
                    <div style="font-size:12px;color:#aaa;margin-top:8px;">— ${item.source}</div>
                    <div class="quiz-result" id="quizResult"></div>
                </div>`;
        } else {
            const isCorrect = state.quizShown === 'correct';
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="quiz-hint">提示: ${item.chinese}</div>
                    <div style="font-size:15px;color:#555;line-height:1.8;text-align:left;background:#f8f9fc;padding:16px 20px;border-radius:10px;border-left:3px solid #e74c3c;">
                        ${example.replace(regex, '<span style="background:#fff3cd;padding:2px 6px;border-radius:4px;font-weight:600;">' + phrase + '</span>')}
                    </div>
                    <div style="font-size:12px;color:#aaa;margin-top:8px;">— ${item.source}</div>
                    <div class="quiz-result" style="color:${isCorrect ? '#27ae60' : '#e74c3c'};font-weight:600;">${isCorrect ? '✓ 正确!' : '✗ 记住这个表达吧'}</div>
                </div>`;
        }
    } else if (state.mode === 'review') {
        // Review mode: show phrase, user self-assesses
        content.innerHTML = `
            <div class="category-badge">${catName}</div>
            <div class="card-inner">
                <div class="phrase">${item.phrase}</div>
                <div class="chinese">${item.chinese}</div>
                <div class="divider"></div>
                <div class="example-label">原文例句</div>
                <div class="example">${item.example}</div>
                <div class="source">— ${item.source}</div>
            </div>`;
        state.isFlipped = true;
    }

    updateActions();
    updateStats();
}

function updateActions() {
    const actions = document.getElementById('actions');
    const items = state.filteredItems;

    if (items.length === 0) return;

    if (state.mode === 'learn') {
        if (!state.isFlipped) {
            actions.innerHTML = `
                <button class="btn btn-show" onclick="flipCard()">查看例句 (Space)</button>`;
        } else {
            actions.innerHTML = `
                <button class="btn btn-unknown" onclick="markUnknown()">不认识 (←)</button>
                <button class="btn btn-know" onclick="markKnown()">认识了 (→)</button>`;
        }
    } else if (state.mode === 'quiz') {
        if (!state.quizShown) {
            actions.innerHTML = `
                <button class="btn btn-show" onclick="showQuizAnswer()">显示答案</button>
                <button class="btn btn-skip" onclick="skipQuiz()">跳过</button>`;
        } else {
            actions.innerHTML = `
                <button class="btn btn-unknown" onclick="markQuizWrong()">我没想起来</button>
                <button class="btn btn-know" onclick="markQuizRight()">我想起来了 (→)</button>`;
        }
    } else if (state.mode === 'review') {
        actions.innerHTML = `
            <button class="btn btn-unknown" onclick="reviewAgain()">再复习一次</button>
            <button class="btn btn-know" onclick="reviewDone()">已掌握 (→)</button>`;
    }
}

function updateStats() {
    const items = getFilteredItems();
    let learnedCount = 0;
    items.forEach(item => {
        const id = getItemId(item);
        if (state.learned[id] && state.learned[id] >= 3) learnedCount++;
    });

    document.getElementById('stat-learned').textContent = learnedCount;
    document.getElementById('stat-remaining').textContent = items.length - learnedCount;
    document.getElementById('stat-streak').textContent = state.streak;
    document.getElementById('stat-total').textContent = items.length;

    // Progress bar
    const pct = items.length > 0 ? Math.round((learnedCount / items.length) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${learnedCount} / ${items.length} 已掌握 (${pct}%)`;
}

// ── Actions ──
function flipCard() {
    state.isFlipped = true;
    renderCard();
}

function nextCard() {
    const items = state.filteredItems;
    state.currentIndex = (state.currentIndex + 1) % items.length;
    state.isFlipped = false;
    state.quizShown = false;
    renderCard();
    // Scroll to top of card
    document.getElementById('card').scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function markKnown() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function markUnknown() {
    state.streak = 0;
    saveState();
    nextCard();
}

function showQuizAnswer() {
    state.quizShown = 'shown';
    renderCard();
}

function skipQuiz() {
    state.streak = 0;
    saveState();
    nextCard();
}

function markQuizRight() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function markQuizWrong() {
    state.streak = 0;
    saveState();
    nextCard();
}

function reviewAgain() {
    state.streak = 0;
    saveState();
    nextCard();
}

function reviewDone() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function resetCategory() {
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;
    state.filteredItems = shuffle(getFilteredItems());
    renderCard();
}

// ── Mode & Category switching ──
function setMode(mode) {
    state.mode = mode;
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active');

    if (mode === 'review') {
        state.filteredItems = shuffle(getReviewItems());
    } else {
        state.filteredItems = shuffle(getFilteredItems());
    }
    renderCard();
}

function setCategory(cat) {
    state.category = cat;
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-cat="${cat}"]`).classList.add('active');

    if (state.mode === 'review') {
        state.filteredItems = shuffle(getReviewItems());
    } else {
        state.filteredItems = shuffle(getFilteredItems());
    }
    renderCard();
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    if (e.code === 'Space') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && !state.isFlipped) {
            flipCard();
        } else if (state.mode === 'quiz' && !state.quizShown) {
            showQuizAnswer();
        } else {
            nextCard();
        }
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && state.isFlipped) {
            markKnown();
        } else if (state.mode === 'quiz' && state.quizShown) {
            markQuizRight();
        } else if (state.mode === 'review') {
            reviewDone();
        }
    } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && state.isFlipped) {
            markUnknown();
        } else if (state.mode === 'quiz' && state.quizShown) {
            markQuizWrong();
        } else if (state.mode === 'review') {
            reviewAgain();
        }
    }
});

// ── Card click ──
document.getElementById('card').addEventListener('click', () => {
    const items = state.filteredItems;
    if (items.length === 0) return;

    if (state.mode === 'learn' && !state.isFlipped) {
        flipCard();
    } else if (state.mode === 'quiz' && !state.quizShown) {
        showQuizAnswer();
    } else {
        nextCard();
    }
});

// ── Init ──
function init() {
    loadState();

    // Tab click handlers
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => setCategory(tab.dataset.cat));
    });

    // Mode button handlers
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // Init filtered items
    state.filteredItems = shuffle(getFilteredItems());
    renderCard();
}

init();
</script>
</body>
</html>
