<head>

<title>IELTS 写作词汇训练器 — Simon 9分语料库</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
    background: #f5f5f5; color: #333; min-height: 100vh;
}

/* ── Header ── */
.header {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    color: #fff; padding: 20px 24px; text-align: center;
    position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 12px rgba(0,0,0,0.15);
}
.header h1 { font-size: 20px; font-weight: 600; letter-spacing: 1px; }
.header .subtitle { font-size: 12px; opacity: 0.7; margin-top: 4px; }

/* ── Stats Bar ── */
.stats-bar {
    display: flex; justify-content: center; gap: 24px;
    padding: 12px 16px; background: #fff; border-bottom: 1px solid #e8e8e8;
    font-size: 13px; color: #666;
}
.stats-bar span { text-align: center; }
.stats-bar strong { color: #1a1a2e; display: block; font-size: 18px; }

/* ── Category Tabs ── */
.tabs {
    display: flex; gap: 0; padding: 12px 16px; background: #fff;
    border-bottom: 1px solid #e8e8e8; overflow-x: auto;
    position: sticky; top: 108px; z-index: 99;
}
.tab {
    padding: 8px 18px; border-radius: 20px; font-size: 13px; cursor: pointer;
    border: 1px solid #ddd; background: #fff; color: #666;
    white-space: nowrap; transition: all 0.2s; margin-right: 8px;
    user-select: none;
}
.tab:hover { background: #f0f4ff; border-color: #2980b9; }
.tab.active { background: #2980b9; color: #fff; border-color: #2980b9; }

/* ── Mode Switcher ── */
.mode-bar {
    display: flex; justify-content: center; gap: 12px; padding: 16px;
}
.mode-btn {
    padding: 8px 24px; border-radius: 20px; border: 2px solid #ddd;
    background: #fff; font-size: 14px; cursor: pointer; transition: all 0.2s;
    user-select: none;
}
.mode-btn:hover { border-color: #2980b9; }
.mode-btn.active { background: #1a1a2e; color: #fff; border-color: #1a1a2e; }

/* ── Card Container ── */
.container { max-width: 600px; margin: 0 auto; padding: 0 16px 32px; }

.card {
    background: #fff; border-radius: 16px; padding: 32px 28px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08); margin-top: 8px;
    min-height: 360px; display: flex; flex-direction: column;
    justify-content: center; transition: transform 0.3s, opacity 0.3s;
    cursor: pointer; position: relative; overflow: hidden;
    user-select: none;
}
.card.flipped { transform: rotateY(0); }
.card .card-inner {
    text-align: center;
}
.card .phrase {
    font-size: 26px; font-weight: 700; color: #1a1a2e;
    line-height: 1.5; margin-bottom: 8px;
}
.card .chinese {
    font-size: 16px; color: #888; margin-bottom: 20px;
}
.card .divider {
    width: 40px; height: 3px; background: #2980b9; margin: 0 auto 20px;
    border-radius: 2px;
}
.card .example-label {
    font-size: 11px; color: #999; text-transform: uppercase;
    letter-spacing: 2px; margin-bottom: 8px;
}
.card .example {
    font-size: 15px; color: #555; line-height: 1.8;
    font-style: italic; background: #f8f9fc; padding: 16px 20px;
    border-radius: 10px; border-left: 3px solid #2980b9;
    text-align: left;
}
.card .source {
    font-size: 11px; color: #aaa; margin-top: 16px;
}
.card .category-badge {
    position: absolute; top: 16px; right: 16px;
    font-size: 10px; padding: 3px 10px; border-radius: 10px;
    background: #e8f4fd; color: #2980b9;
}

/* ── Quiz mode ── */
.card .blank {
    display: inline-block; min-width: 120px; border-bottom: 2px dashed #e74c3c;
    padding: 0 8px; margin: 0 4px; color: #e74c3c; font-weight: 600;
}
.card .quiz-input {
    width: 100%; padding: 12px 16px; border: 2px solid #ddd; border-radius: 10px;
    font-size: 16px; text-align: center; margin: 12px 0; outline: none;
    transition: border-color 0.2s;
}
.card .quiz-input:focus { border-color: #2980b9; }
.card .quiz-hint { font-size: 14px; color: #888; margin-bottom: 12px; }
.card .quiz-result { font-size: 14px; margin-top: 8px; min-height: 20px; }

/* ── Action Buttons ── */
.actions {
    display: flex; gap: 12px; justify-content: center; margin-top: 20px;
}
.btn {
    padding: 12px 32px; border-radius: 24px; border: none; font-size: 15px;
    cursor: pointer; transition: all 0.2s; font-weight: 500; user-select: none;
}
.btn-know { background: #27ae60; color: #fff; }
.btn-know:hover { background: #219a52; transform: translateY(-1px); }
.btn-unknown { background: #e74c3c; color: #fff; }
.btn-unknown:hover { background: #c0392b; transform: translateY(-1px); }
.btn-next { background: #2980b9; color: #fff; }
.btn-next:hover { background: #2471a3; transform: translateY(-1px); }
.btn-show { background: #8e44ad; color: #fff; }
.btn-show:hover { background: #7d3c98; }
.btn-skip { background: #95a5a6; color: #fff; }
.btn-skip:hover { background: #7f8c8d; }

/* ── Progress ── */
.progress-text {
    text-align: center; font-size: 13px; color: #999; margin-top: 16px;
}
.progress-bar {
    height: 4px; background: #e8e8e8; border-radius: 2px; margin-top: 8px;
    overflow: hidden;
}
.progress-bar .fill {
    height: 100%; background: #2980b9; border-radius: 2px; transition: width 0.3s;
}

/* ── Keyboard hints ── */
.kbd-hints {
    text-align: center; font-size: 12px; color: #bbb; margin-top: 20px;
}
.kbd {
    display: inline-block; background: #eee; padding: 1px 7px; border-radius: 4px;
    border: 1px solid #ddd; font-family: monospace; font-size: 11px;
}

/* ── Responsive ── */
@media (max-width: 480px) {
    .card { padding: 24px 18px; min-height: 300px; }
    .card .phrase { font-size: 22px; }
    .btn { padding: 10px 20px; font-size: 14px; }
    .stats-bar { gap: 12px; font-size: 11px; }
    .stats-bar strong { font-size: 15px; }
}
</style>
</head>

eature of university education.", "category": "academic", "source": "Online University Courses"}, {"phrase": "although it can be argued that", "chinese": "尽管有人会说……", "example": "Although it can be argued that governments could save money by allowing this to happen, I believe that these languages should be protected and preserved.", "category": "academic", "source": "Minority Languages"}, {"phrase": "while I recognise", "chinese": "虽然我承认……", "example": "In conclusion, while I recognise the possible disadvantages of online learning, I consider it to be a positive development overall.", "category": "academic", "source": "Online University Courses"}, {"phrase": "I completely disagree", "chinese": "我完全不同意", "example": "I completely disagree with this point of view.", "category": "academic", "source": "Wild Animals Protection"}, {"phrase": "I partly agree", "chinese": "我部分同意", "example": "I partly agree with this assertion; while it may be true in the case of some societies, others seem to be unaffected by technology and the modern world.", "category": "academic", "source": "Traditions and Technology"}, {"phrase": "I still believe that", "chinese": "我仍然认为……", "example": "While there are some strong arguments against the setting of homework, I still believe that it is a necessary aspect of education.", "category": "academic", "source": "Homework for School Children"}, {"phrase": "people have differing views", "chinese": "人们有不同的看法", "example": "People have differing views with regard to the question of how to make our roads safer.", "category": "academic", "source": "Strict Punishments for Driving Offences"}, {"phrase": "there are several reasons why", "chinese": "有几个原因可以解释为什么……", "example": "There are several reasons why people might argue that homework is an unnecessary burden on children.", "category": "academic", "source": "Homework for School Children"}, {"phrase": "the main benefit of ... is that", "chinese": "……的主要好处是……", "example": "(示例: the main benefit of ... is t s is a waste of resources.", "category": "academic", "source": "Wild Animals Protection"}, {"phrase": "it is usually ... that ensures", "chinese": "通常正是……保证了", "example": "(示例: it is usually ... that ensures)", "category": "academic", "source": "Simon范文"}, {"phrase": "most scientists agree that", "chinese": "大多数科学家认为……", "example": "It is usually the protection of natural habitats that ensures the survival of wild animals, and most scientists agree that these habitats are also crucial for human survival.", "category": "academic", "source": "Wild Animals Protection"}, {"phrase": "the costs of ... would far outweigh", "chinese": "……的成本将远远超过", "example": "(示例: the costs of ... would far outweigh)", "category": "academic", "source": "Simon范文"}, {"phrase": "we have no right to decide", "chinese": "我们无权决定……", "example": "In conclusion, we have no right to decide whether or not wild animals should exist, and I believe that we should do everything we can to protect them.", "category": "academic", "source": "Wild Animals Protection"}, {"phrase": "I partly agree with this assertion", "chinese": "我部分同意这一说法", "example": "I partly agree with this assertion; while it may be true in the case of some societies, others seem to be unaffected by technology and the modern world.", "category": "academic", "source": "Traditions and Technology"}, {"phrase": "it may be true in the case of", "chinese": "就……而言这可能是对的", "example": "I partly agree with this assertion; while it may be true in the case of some societies, others seem to be unaffected by technology and the modern world.", "category": "academic", "source": "Traditions and Technology"}, {"phrase": "people's opinions differ as to whether", "chinese": "人们对是否……意见不一", "example": "People's opinions differ as to whether or not school children should be given homework.", "category": "academic", "source": "Homework for School Children"}, {"phrase": "there are several reasons why people might argue that", "chinese": "有几个原因可以解释为什么人们认为……", "example": "There are several reasons why people might argue that homework is an unnecessary burden on children.", "category": "academic", "source": "Homework for School Children"}, {"phrase": "the main drawback of ... is that", "chinese": "……的主要缺点是……", "example": "(示例: the main drawback of ... is that)", "category": "academic", "source": "Simon范文"}, {"phrase": "there are various reasons why it might be considered beneficial to", "chinese": "有很多理由说明为什么……可能是有益的", "example": "There are various reasons why it might be considered beneficial to allow people to be paid extremely high salaries.", "category": "academic", "source": "High Salaries Cap"}, {"phrase": "one possible consequence of ... could be that", "chinese": "……的一个可能后果是……", "example": "(示例: one possible consequence of ... could be that)", "category": "academic", "source": "Simon范文"}, {"phrase": "it seems to me that it would be better to", "chinese": "在我看来……会更好", "example": "(示例: it seems to me that it would be better to)", "category": "academic", "source": "Simon范文"}, {"phrase": "on balance", "chinese": "总的来说", "example": "In conclusion, it seems to me that it would be better, on balance, for governments to set a limit on the wages of the highest earners in society.", "category": "academic", "source": "High Salaries Cap"}, {"phrase": "I cannot imagine", "chinese": "我无法想象……", "example": "I cannot imagine the police being called to stop people from parachuting off a mountain face or surfing on an isolated beach.", "category": "academic", "source": "Extreme Sports Ban"}, {"phrase": "this could have a negative impact on", "chinese": "这可能对……产生负面影响", "example": "Similarly, students who study online do not come into direct contact with each other, and this could have a negative impact on peer support, discussion and exchange of ideas.", "category": "academic", "source": "Online University Courses"}, {"phrase": "it is rare to find a person who", "chinese": "很难找到一个……的人", "example": "Secondly, the greatest joy in life is us e": "IELTS常用短语动词"}, {"phrase": "break down", "chinese": "分解/崩溃", "example": "We need to break down the problem into smaller parts.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "settle down", "chinese": "安定下来", "example": "Young people are settling down later in life.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "grow up", "chinese": "成长", "example": "Children who grow up in poverty face many challenges.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "build up", "chinese": "建立/积累", "example": "Trust needs to be built up over time.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "clean up", "chinese": "清理/整顿", "example": "We need to clean up the environment.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "speed up", "chinese": "加速", "example": "Technology has speeded up the pace of life.", "category": "phrasal", "source": "IELTS常用短语动词"}, {"phrase": "slow down", "chinese": "减速/放慢", "example": "We need to slow down and reflect on what matters.", "category": "phrasal", "source": "IELTS常用短语动词"}];
const CAT_NAMES = {"academic": "学术论证", "cohesive": "衔接过渡", "structure": "高分句型", "collocation": "核心搭配", "topic": "话题词汇", "paraphrase": "同义替换", "awl": "AWL学术词", "phrasal": "短语动词"};
const STORAGE_KEY = 'ielts_vocab_trainer_state';

// ── State ──
let state = {
    mode: 'learn',       // learn | quiz | review
    category: 'all',
    currentIndex: 0,
    isFlipped: false,
    streak: 0,
    learned: {},       // { phrase_id: times_correct }
    filteredItems: [],
    quizShown: false,
};

function loadState() {
    try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        if (saved) {
            state.learned = saved.learned || {};
            state.streak = saved.streak || 0;
        }
    } catch(e) {}
}

function saveState() {
    try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
            learned: state.learned,
            streak: state.streak,
        }));
    } catch(e) {}
}

// ── Filter items ──
function getFilteredItems() {
    if (state.category === 'all') return [...DATA];
    return DATA.filter(item => item.category === state.category);
}

function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
}

// ── Get items for current mode ──
function getReviewItems() {
    // Items not yet learned (learned < 3 times)
    const items = getFilteredItems();
    return items.filter((_, i) => {
        const id = getItemId(items[i]);
        return !state.learned[id] || state.learned[id] < 3;
    });
}

function getItemId(item) {
    return item.phrase;
}

// ── Render ──
function renderCard() {
    const card = document.getElementById('card');
    const content = document.getElementById('cardContent');
    const items = state.filteredItems;

    if (items.length === 0) {
        content.innerHTML = `
            <div style="text-align:center;padding:40px 20px;">
            <div style="font-size:48px;margin-bottom:16px;">&#127881;</div>
            <div style="font-size:20px;color:#27ae60;font-weight:600;margin-bottom:8px;">这一组你已经全部掌握了!</div>
            <div style="font-size:14px;color:#888;">换一个分类或模式继续学习吧</div>
            </div>`;
        document.getElementById('actions').innerHTML = `
            <button class="btn btn-next" onclick="resetCategory()">重新学习本组</button>`;
        updateStats();
        return;
    }

    if (state.currentIndex >= items.length) {
        state.currentIndex = 0;
        state.filteredItems = shuffle(items);
    }

    const item = items[state.currentIndex];
    const catName = CAT_NAMES[item.category] || item.category;

    if (state.mode === 'learn') {
        if (!state.isFlipped) {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="phrase">${item.phrase}</div>
                    <div class="chinese">${item.chinese}</div>
                    <div style="color:#bbb;font-size:12px;margin-top:30px;">点击卡片或按空格键查看例句</div>
                </div>`;
        } else {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="phrase">${item.phrase}</div>
                    <div class="chinese">${item.chinese}</div>
                    <div class="divider"></div>
                    <div class="example-label">原文例句</div>
                    <div class="example">${item.example}</div>
                    <div class="source">— ${item.source}</div>
                </div>`;
        }
    } else if (state.mode === 'quiz') {
        // Blank out the keyword from the example
        const phrase = item.phrase;
        const example = item.example;
        const escaped = phrase.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        const regex = new RegExp(escaped.replace(/\s+/g, '\\s+'), 'i');
        const blankedExample = example.replace(regex, '<span class="blank">?</span>');

        if (!state.quizShown) {
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="quiz-hint">提示: ${item.chinese}</div>
                    <div style="font-size:15px;color:#555;line-height:1.8;text-align:left;background:#f8f9fc;padding:16px 20px;border-radius:10px;border-left:3px solid #e74c3c;">
                        ${blankedExample}
                    </div>
                    <div style="font-size:12px;color:#aaa;margin-top:8px;">— ${item.source}</div>
                    <div class="quiz-result" id="quizResult"></div>
                </div>`;
        } else {
            const isCorrect = state.quizShown === 'correct';
            content.innerHTML = `
                <div class="category-badge">${catName}</div>
                <div class="card-inner">
                    <div class="quiz-hint">提示: ${item.chinese}</div>
                    <div style="font-size:15px;color:#555;line-height:1.8;text-align:left;background:#f8f9fc;padding:16px 20px;border-radius:10px;border-left:3px solid #e74c3c;">
                        ${example.replace(regex, '<span style="background:#fff3cd;padding:2px 6px;border-radius:4px;font-weight:600;">' + phrase + '</span>')}
                    </div>
                    <div style="font-size:12px;color:#aaa;margin-top:8px;">— ${item.source}</div>
                    <div class="quiz-result" style="color:${isCorrect ? '#27ae60' : '#e74c3c'};font-weight:600;">${isCorrect ? '✓ 正确!' : '✗ 记住这个表达吧'}</div>
                </div>`;
        }
    } else if (state.mode === 'review') {
        // Review mode: show phrase, user self-assesses
        content.innerHTML = `
            <div class="category-badge">${catName}</div>
            <div class="card-inner">
                <div class="phrase">${item.phrase}</div>
                <div class="chinese">${item.chinese}</div>
                <div class="divider"></div>
                <div class="example-label">原文例句</div>
                <div class="example">${item.example}</div>
                <div class="source">— ${item.source}</div>
            </div>`;
        state.isFlipped = true;
    }

    updateActions();
    updateStats();
}

function updateActions() {
    const actions = document.getElementById('actions');
    const items = state.filteredItems;

    if (items.length === 0) return;

    if (state.mode === 'learn') {
        if (!state.isFlipped) {
            actions.innerHTML = `
                <button class="btn btn-show" onclick="flipCard()">查看例句 (Space)</button>`;
        } else {
            actions.innerHTML = `
                <button class="btn btn-unknown" onclick="markUnknown()">不认识 (←)</button>
                <button class="btn btn-know" onclick="markKnown()">认识了 (→)</button>`;
        }
    } else if (state.mode === 'quiz') {
        if (!state.quizShown) {
            actions.innerHTML = `
                <button class="btn btn-show" onclick="showQuizAnswer()">显示答案</button>
                <button class="btn btn-skip" onclick="skipQuiz()">跳过</button>`;
        } else {
            actions.innerHTML = `
                <button class="btn btn-unknown" onclick="markQuizWrong()">我没想起来</button>
                <button class="btn btn-know" onclick="markQuizRight()">我想起来了 (→)</button>`;
        }
    } else if (state.mode === 'review') {
        actions.innerHTML = `
            <button class="btn btn-unknown" onclick="reviewAgain()">再复习一次</button>
            <button class="btn btn-know" onclick="reviewDone()">已掌握 (→)</button>`;
    }
}

function updateStats() {
    const items = getFilteredItems();
    let learnedCount = 0;
    items.forEach(item => {
        const id = getItemId(item);
        if (state.learned[id] && state.learned[id] >= 3) learnedCount++;
    });

    document.getElementById('stat-learned').textContent = learnedCount;
    document.getElementById('stat-remaining').textContent = items.length - learnedCount;
    document.getElementById('stat-streak').textContent = state.streak;
    document.getElementById('stat-total').textContent = items.length;

    // Progress bar
    const pct = items.length > 0 ? Math.round((learnedCount / items.length) * 100) : 0;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressText').textContent = `${learnedCount} / ${items.length} 已掌握 (${pct}%)`;
}

// ── Actions ──
function flipCard() {
    state.isFlipped = true;
    renderCard();
}

function nextCard() {
    const items = state.filteredItems;
    state.currentIndex = (state.currentIndex + 1) % items.length;
    state.isFlipped = false;
    state.quizShown = false;
    renderCard();
    // Scroll to top of card (Safari-compatible)
    try {
        document.getElementById('card').scrollIntoView({ behavior: 'smooth', block: 'center' });
    } catch(e) {
        document.getElementById('card').scrollIntoView();
    }
}

function markKnown() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function markUnknown() {
    state.streak = 0;
    saveState();
    nextCard();
}

function showQuizAnswer() {
    state.quizShown = 'shown';
    renderCard();
}

function skipQuiz() {
    state.streak = 0;
    saveState();
    nextCard();
}

function markQuizRight() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function markQuizWrong() {
    state.streak = 0;
    saveState();
    nextCard();
}

function reviewAgain() {
    state.streak = 0;
    saveState();
    nextCard();
}

function reviewDone() {
    const item = state.filteredItems[state.currentIndex];
    const id = getItemId(item);
    state.learned[id] = (state.learned[id] || 0) + 1;
    state.streak++;
    saveState();
    nextCard();
}

function resetCategory() {
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;
    state.filteredItems = shuffle(getFilteredItems());
    renderCard();
}

// ── Mode & Category switching ──
function setMode(mode) {
    state.mode = mode;
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;

    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    document.querySelector(`.mode-btn[data-mode="${mode}"]`).classList.add('active');

    if (mode === 'review') {
        state.filteredItems = shuffle(getReviewItems());
    } else {
        state.filteredItems = shuffle(getFilteredItems());
    }
    renderCard();
}

function setCategory(cat) {
    state.category = cat;
    state.currentIndex = 0;
    state.isFlipped = false;
    state.quizShown = false;

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelector(`.tab[data-cat="${cat}"]`).classList.add('active');

    if (state.mode === 'review') {
        state.filteredItems = shuffle(getReviewItems());
    } else {
        state.filteredItems = shuffle(getFilteredItems());
    }
    renderCard();
}

// ── Keyboard shortcuts ──
document.addEventListener('keydown', (e) => {
    if (e.target.tagName === 'INPUT') return;

    if (e.code === 'Space') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && !state.isFlipped) {
            flipCard();
        } else if (state.mode === 'quiz' && !state.quizShown) {
            showQuizAnswer();
        } else {
            nextCard();
        }
    } else if (e.code === 'ArrowRight') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && state.isFlipped) {
            markKnown();
        } else if (state.mode === 'quiz' && state.quizShown) {
            markQuizRight();
        } else if (state.mode === 'review') {
            reviewDone();
        }
    } else if (e.code === 'ArrowLeft') {
        e.preventDefault();
        const items = state.filteredItems;
        if (items.length === 0) return;

        if (state.mode === 'learn' && state.isFlipped) {
            markUnknown();
        } else if (state.mode === 'quiz' && state.quizShown) {
            markQuizWrong();
        } else if (state.mode === 'review') {
            reviewAgain();
        }
    }
});

// ── Card click ──
document.getElementById('card').addEventListener('click', () => {
    const items = state.filteredItems;
    if (items.length === 0) return;

    if (state.mode === 'learn' && !state.isFlipped) {
        flipCard();
    } else if (state.mode === 'quiz' && !state.quizShown) {
        showQuizAnswer();
    } else {
        nextCard();
    }
});

// ── Init ──
function init() {
    loadState();

    // Tab click handlers
    document.querySelectorAll('.tab').forEach(tab => {
        tab.addEventListener('click', () => setCategory(tab.dataset.cat));
    });

    // Mode button handlers
    document.querySelectorAll('.mode-btn').forEach(btn => {
        btn.addEventListener('click', () => setMode(btn.dataset.mode));
    });

    // Init filtered items
    state.filteredItems = shuffle(getFilteredItems());
    renderCard();
}

init();

// Falls back to showing content if JS partially fails
document.addEventListener('DOMContentLoaded', function() {
    var card = document.getElementById('cardContent');
    if (card && !card.innerHTML.trim()) {
        card.innerHTML = '<div style="text-align:center;padding:40px;">加载中... 如卡住请刷新页面</div>';
    }
});
</script>
</body>
</html>
